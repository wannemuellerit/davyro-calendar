name: VPS runner smoke test

on:
  push:
    paths:
      - .github/workflows/runner-smoke.yml
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/runner-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, contabo-ci-01]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check runner and Docker
        run: |
          test "$(id -un)" = githubrunner
          uname -r
          free -h
          df -h /
          docker version
          docker compose version
          docker buildx version

      - name: Test container and exclusive host port
        run: |
          container_name="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:16379:6379 \
            --memory 128m --cpus 1 redis:8.4-alpine
          for attempt in {1..20}; do
            if docker exec "$container_name" redis-cli ping | grep -qx PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm --force "ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
