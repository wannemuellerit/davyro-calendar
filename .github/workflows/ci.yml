name: CI

on:
  push:
    branches: [ "development", "main", "feature/**" ]
  pull_request:
    branches: [ "development", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - name: Verify frontend dependencies and generated browser assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run audit
          npm run build:assets
          npm run test:frontend

      - name: Run test suite
        run: ./vendor/bin/phpunit -c tests/phpunit.xml

      - name: Validate operational scripts
        run: |
          for script in scripts/backup.sh scripts/verify-backup.sh scripts/restore.sh; do sh -n "$script"; done
          bash -n scripts/deploy-production.sh

      - name: Validate standalone Compose contract
        run: docker compose --env-file .env.example -f compose.standalone.yaml config --quiet

      - name: Verify production isolation
        run: |
          docker compose --env-file .env.example -f compose.standalone.yaml -f compose.production.yaml config --format json | jq -e '
            all(.services[]; ((.ports // []) | length) == 0) and
            (.services.database.networks | keys) == ["calendar-backend"] and
            (.services.baikal.networks | keys) == ["calendar-backend"] and
            .services.baikal.environment.DAVYRO_CREATE_DEMO_USER == "false" and
            .services.calendar.environment.DAVYRO_HUB_REQUIRED == "true" and
            .services.calendar.environment.AGENDAV_ENVIRONMENT == "prod" and
            .services.calendar.environment.AGENDAV_DB_HOST == "calendar-database" and
            .services["webcal-worker"].environment.BAIKAL_DB_HOST == "calendar-database"
          ' >/dev/null

  production-image:
    name: Production Apache image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production Apache image
        run: |
          docker build --pull --tag davyro-calendar-ci .
          docker run --rm --entrypoint httpd davyro-calendar-ci -t
          docker run --rm --entrypoint sh davyro-calendar-ci -ec \
            'test ! -d /app/tests && test ! -e /app/vendor/bin/phpunit && test ! -d /app/node_modules'

  phase-zero-contract:
    name: Test-Image und Baikal-0.12.1-Vertrag
    runs-on: ubuntu-24.04
    # Bound the complete isolated image and CalDAV lifecycle contract.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run reproducible Phase-0 contract
        run: bash tests/phase0_contract.sh
